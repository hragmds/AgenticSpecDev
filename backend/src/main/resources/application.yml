spring:
  application:
    name: banking-app
    
  datasource:
    url: jdbc:sqlite:banking.db
    driver-class-name: org.sqlite.JDBC
    
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false
    
  sql:
    init:
      mode: never
      
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 30m
      
logging:
  level:
    com.banking: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    
management:
  endpoints:
    web:
      exposure:
        include: health,info