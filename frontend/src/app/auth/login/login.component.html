<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Sign in to your account
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Banking App MVP - Demo Login
      </p>
    </div>

    <!-- Demo Credentials Helper -->
    <div class="bg-blue-50 border border-blue-200 rounded-md p-4">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-blue-800">
            Demo Credentials
          </h3>
          <div class="mt-2 text-sm text-blue-700">
            <p>Username: <strong>demo</strong></p>
            <p>Password: <strong>password</strong></p>
            <button 
              type="button"
              (click)="fillDemoCredentials()"
              class="mt-2 text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 px-2 py-1 rounded transition-colors">
              Fill Demo Credentials
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm -space-y-px">
        <!-- Username Field -->
        <div>
          <label for="username" class="sr-only">Username</label>
          <input 
            id="username"
            name="username"
            type="text"
            formControlName="username"
            required
            class="appearance-none rounded-none relative block w-full px-3 py-2 border placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            [class.border-red-300]="hasFieldError('username', 'required')"
            [class.border-gray-300]="!hasFieldError('username', 'required')"
            placeholder="Username" />
          <div *ngIf="hasFieldError('username', 'required')" 
               class="text-red-600 text-sm mt-1 px-3">
            {{ getFieldErrorMessage('username') }}
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="sr-only">Password</label>
          <div class="relative">
            <input 
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              required
              class="appearance-none rounded-none relative block w-full px-3 py-2 pr-10 border placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
              [class.border-red-300]="hasFieldError('password', 'required')"
              [class.border-gray-300]="!hasFieldError('password', 'required')"
              placeholder="Password" />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
              <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                <path *ngIf="showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
            </button>
          </div>
          <div *ngIf="hasFieldError('password', 'required')" 
               class="text-red-600 text-sm mt-1 px-3">
            {{ getFieldErrorMessage('password') }}
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative">
        <span class="block sm:inline">{{ error }}</span>
      </div>

      <!-- Submit Button -->
      <div>
        <button 
          type="submit"
          [disabled]="loading || loginForm.invalid"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          
          <!-- Loading Spinner -->
          <div *ngIf="loading" class="absolute left-0 inset-y-0 flex items-center pl-3">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
          
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>
      </div>

      <!-- Form Status -->
      <div class="text-center text-sm text-gray-600">
        Form Status: 
        <span [class]="loginForm.valid ? 'text-green-600' : 'text-red-600'">
          {{ loginForm.valid ? 'Valid' : 'Invalid' }}
        </span>
      </div>
    </form>
  </div>
</div>
