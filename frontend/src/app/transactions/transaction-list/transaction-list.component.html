<div class="overflow-x-auto">
  <table *ngIf="transactions.length > 0" class="w-full text-sm">
    <thead class="bg-gray-50 border-b border-gray-200">
      <tr>
        <th class="px-4 py-3 text-left font-medium text-gray-900">From</th>
        <th class="px-4 py-3 text-left font-medium text-gray-900">To</th>
        <th class="px-4 py-3 text-right font-medium text-gray-900">Amount</th>
        <th class="px-4 py-3 text-left font-medium text-gray-900">Description</th>
        <th class="px-4 py-3 text-left font-medium text-gray-900">Date</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      <tr *ngFor="let transaction of transactions" class="hover:bg-gray-50">
        <td class="px-4 py-3 text-gray-900">A{{ transaction.fromAccountId }}</td>
        <td class="px-4 py-3 text-gray-900">A{{ transaction.toAccountId }}</td>
        <td class="px-4 py-3 text-right text-gray-900 font-medium">
          ${{ transaction.amount | number: '1.2-2' }}
        </td>
        <td class="px-4 py-3 text-gray-600">{{ transaction.description || '-' }}</td>
        <td class="px-4 py-3 text-gray-600 text-xs">
          {{ transaction.transactionDate | date: 'short' }}
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Empty State -->
  <div *ngIf="transactions.length === 0" class="text-center py-8 text-gray-500">
    No transactions found
  </div>
</div>
