openapi: 3.0.3
info:
  title: Personal Banking Application API
  description: REST API for personal banking operations including authentication, account management, and money transfers
  version: 1.0.0
  contact:
    name: Banking App Team

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Authentication
    description: User authentication operations
  - name: Accounts
    description: Account information retrieval
  - name: Transactions
    description: Transaction history operations
  - name: Transfers
    description: Money transfer operations

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates user with username and password (simple/fake auth - any non-empty values accepted)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request (empty username or password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidates current session
      operationId: logout
      security:
        - sessionToken: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts:
    get:
      tags:
        - Accounts
      summary: Get user's accounts
      description: Returns all accounts belonging to the authenticated user
      operationId: getAccounts
      security:
        - sessionToken: []
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/recent:
    get:
      tags:
        - Transactions
      summary: Get recent transactions
      description: Returns the 10 most recent transactions across all user accounts
      operationId: getRecentTransactions
      security:
        - sessionToken: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of transactions to return (default 10)
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transfers:
    post:
      tags:
        - Transfers
      summary: Create a money transfer
      description: Transfers money between two accounts owned by the authenticated user
      operationId: createTransfer
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Invalid transfer request (validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sameAccount:
                  value:
                    message: "Source and destination accounts must be different"
                    timestamp: "2025-11-19T10:30:00Z"
                insufficientFunds:
                  value:
                    message: "Insufficient funds in source account"
                    timestamp: "2025-11-19T10:30:00Z"
                invalidAmount:
                  value:
                    message: "Transfer amount must be greater than zero"
                    timestamp: "2025-11-19T10:30:00Z"
        '401':
          description: Not authenticated or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found or doesn't belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Session token obtained from login endpoint

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: User's login identifier (any non-empty value accepted)
          example: "demo"
        password:
          type: string
          minLength: 1
          description: User's password (any non-empty value accepted)
          example: "password"

    LoginResponse:
      type: object
      required:
        - token
        - userId
        - username
      properties:
        token:
          type: string
          description: Session token for subsequent API calls
          example: "abc123def456"
        userId:
          type: integer
          format: int64
          description: Unique user identifier
          example: 1
        username:
          type: string
          description: User's username
          example: "demo"

    AccountDto:
      type: object
      required:
        - id
        - accountType
        - accountNumber
        - balance
      properties:
        id:
          type: integer
          format: int64
          description: Unique account identifier
          example: 1
        accountType:
          type: string
          enum: [CHECKING, SAVINGS]
          description: Type of account
          example: "CHECKING"
        accountNumber:
          type: string
          description: Masked account number for display
          example: "****1234"
        balance:
          type: number
          format: double
          description: Current account balance in USD (2 decimal places)
          example: 5000.00
          minimum: 0

    TransactionDto:
      type: object
      required:
        - id
        - accountId
        - amount
        - description
        - transactionDate
      properties:
        id:
          type: integer
          format: int64
          description: Unique transaction identifier
          example: 1
        accountId:
          type: integer
          format: int64
          description: Account this transaction belongs to
          example: 1
        amount:
          type: number
          format: double
          description: Transaction amount in USD (positive = credit, negative = debit)
          example: -50.00
        description:
          type: string
          maxLength: 255
          description: Transaction description
          example: "Grocery Store"
        note:
          type: string
          maxLength: 500
          description: Optional user note (present for transfers)
          example: "Monthly grocery budget"
        transactionDate:
          type: string
          format: date-time
          description: When the transaction occurred (ISO 8601)
          example: "2025-11-19T10:30:00Z"

    TransferRequest:
      type: object
      required:
        - sourceAccountId
        - destinationAccountId
        - amount
      properties:
        sourceAccountId:
          type: integer
          format: int64
          description: Account to withdraw money from
          example: 1
        destinationAccountId:
          type: integer
          format: int64
          description: Account to deposit money into
          example: 2
        amount:
          type: number
          format: double
          description: Amount to transfer in USD (must be > 0, max 2 decimal places)
          example: 100.00
          minimum: 0.01
        note:
          type: string
          maxLength: 500
          description: Optional note for the transfer
          example: "Savings contribution"

    TransferResponse:
      type: object
      required:
        - success
        - transferId
        - updatedAccounts
      properties:
        success:
          type: boolean
          description: Whether transfer completed successfully
          example: true
        transferId:
          type: integer
          format: int64
          description: Unique identifier for this transfer
          example: 1
        updatedAccounts:
          type: array
          description: Source and destination accounts with updated balances
          items:
            $ref: '#/components/schemas/AccountDto'

    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          description: Human-readable error message
          example: "Insufficient funds in source account"
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: "2025-11-19T10:30:00Z"
        details:
          type: object
          description: Additional error details (optional)
          additionalProperties: true
